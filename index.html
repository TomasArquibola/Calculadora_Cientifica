<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">
  <header>
    <h1>Calculadora Científica</h1>
    <button id="modo">🌙</button>
    <button id="musicaBtn">🎵</button>
  </header>

  <main>
    <div>
      <footer>
        <div>
          <h3>Historial</h3>
          <button class="Delete" onclick="borrarHistorial()">Borrar Historial</button>
        </div>
        <div id="historial"></div>
      </footer>
    </div>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button onclick="operar('sin(')">sin</button>
            <button onclick="operar('cos(')">cos</button>
            <button onclick="operar('tan(')">tan</button>
            <button onclick="operar('log(')">log</button>
            <button onclick="operar('sqrt(')">√</button>

            <button onclick="agregar('7')">7</button>
            <button onclick="agregar('8')">8</button>
            <button onclick="agregar('9')">9</button>
            <button onclick="agregar('/')">÷</button>

            <button onclick="agregar('4')">4</button>
            <button onclick="agregar('5')">5</button>
            <button onclick="agregar('6')">6</button>
            <button onclick="agregar('*')">×</button>

            <button onclick="agregar('1')">1</button>
            <button onclick="agregar('2')">2</button>
            <button onclick="agregar('3')">3</button>
            <button onclick="agregar('-')">−</button>

            <button onclick="agregar('0')">0</button>
            <button onclick="agregar('.')">.</button>
            <button onclick="calcular()">=</button>
            <button onclick="agregar('+')">+</button>

            <button onclick="limpiar()">C</button>
            <button class="Delete" onclick="borrar()">←</button>
        </div>
    </div>
  </main>

  <audio id="clickSound" src="click.mp3"></audio>
  <audio id="bgMusic" src="musica.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
